# Build the runner image and publish it as a GitHub release.
#
# The image is built with Packer (QEMU/KVM) on a GitHub-hosted Linux runner,
# converted to a Hyper-V VHDX, compressed (gzip) and split into parts under
# the 2 GiB limit of release assets. host/BuildVm.ps1 downloads the parts,
# checks SHA256SUMS and joins them.
#
# Start it with a tag (git tag v1.0.0 && git push origin v1.0.0) or by hand
# (Actions -> image -> Run workflow, with a new tag name).
name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  PACKER_VERSION: 1.16.2
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "::error::Bad tag: $TAG"; exit 1; }

      # The runner has about 14 GB free; the build needs about 30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      # Hardware acceleration for QEMU. Docs:
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf pigz

      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      # Without a token, api.github.com allows 60 requests per hour for each
      # IP, and the IPs of GitHub-hosted runners are shared: packer init and
      # the image scripts (runner and tool versions) then fail with 403.
      - name: Build the image
        working-directory: packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          packer init .
          PACKER_LOG=0 packer build -only=qemu.build-vm -color=false \
            -var "build_password=$password" -var "github_token=$GITHUB_TOKEN" .

      - name: Convert to VHDX, compress and split
        run: |
          mkdir dist
          qemu-img convert -p -f qcow2 -O vhdx -o subformat=dynamic \
            packer/output/build-vm.qcow2 dist/build-vm.vhdx
          rm -rf packer/output
          (cd dist && sha256sum build-vm.vhdx > build-vm.vhdx.sha256)
          pigz --fast --stdout dist/build-vm.vhdx | split -b 1900M -d -a 2 - dist/build-vm.vhdx.gz.part-
          rm dist/build-vm.vhdx
          (cd dist && sha256sum build-vm.vhdx.gz.part-* > SHA256SUMS && cat SHA256SUMS build-vm.vhdx.sha256)
          ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "build-vm $TAG" \
            --notes "Hyper-V image (VHDX, Ubuntu 24.04). Install with: .\\host\\BuildVm.ps1 Install -Version $TAG"
